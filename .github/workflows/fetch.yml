name: Fetch Manorama News Hourly

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every 1 hour
  workflow_dispatch: # Allows manual trigger

# This permission block fixes the "Exit Code 128" push error
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        # Updated to v4 to fix the Node 20 deprecation warning
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Updated to v4 to fix the Node 20 deprecation warning
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Upgraded to a newer Node version for stability

      - name: Run news scraper
        run: node scraper.js

      - name: Commit and push news updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git commit -m "Automated news update" || exit 0
          git push
