name: Fetch Manorama News Hourly

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every 1 hour
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NEW STEP: Install the invisible browser and stealth armor
      - name: Install Puppeteer and Stealth Plugin
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run news scraper
        run: node scraper.js

      - name: Commit and push news updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git commit -m "Automated news update via Puppeteer" || exit 0
          git push
