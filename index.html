<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മനോരമ വാർത്തകൾ</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --container-bg: #fff;
            --text-color: #333;
            --header-bg: #0055a5;
            --border-color: #eee;
            --link-color: #0055a5;
            --font-scale: 16px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --header-bg: #1a1a1a;
            --border-color: #333;
            --link-color: #66b2ff;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            font-size: var(--font-scale);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: var(--header-bg);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
            align-items: center;
        }

        select, button {
            padding: 10px;
            font-size: 1em;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            flex-grow: 1;
        }

        details {
            border-bottom: 1px solid var(--border-color);
        }
        
        summary {
            padding: 15px;
            cursor: pointer;
            list-style-type: none;
            display: block;
        }
        
        summary::-webkit-details-marker {
            display: none;
        }

        /* Full heading wraps cleanly so Screen Readers read the entire sentence */
        summary h2 {
            display: block;
            margin: 0;
            font-size: 1.1em;
            font-weight: bold;
            line-height: 1.5;
            white-space: normal;
            word-wrap: break-word;
        }

        .news-content {
            padding: 0 15px 15px 15px;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .original-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--link-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">മലയാള മനോരമ</div>
        
        <div class="controls">
            <select id="categorySelect" onchange="filterNews()" aria-label="വാർത്താ വിഭാഗം തിരഞ്ഞെടുക്കുക">
                <option value="all" selected>എല്ലാ വാർത്തകളും (All News)</option>
                <option value="kerala">കേരളം (Kerala)</option>
                <option value="sports">സ്പോർട്സ് (Sports)</option>
                <option value="movies">സിനിമ (Movies)</option>
            </select>

            <button onclick="toggleDarkMode()" aria-label="ഡാർക്ക് മോഡ്">🌙</button>
        </div>
        
        <div id="news-list" aria-live="polite">
            <div style="padding: 20px; text-align: center;">വാർത്തകൾ ലോഡ് ചെയ്യുന്നു...</div>
        </div>
    </div>

    <script>
        let allNews = [];

        function toggleDarkMode() {
            const body = document.body;
            body.hasAttribute('data-theme') ? body.removeAttribute('data-theme') : body.setAttribute('data-theme', 'dark');
        }

        async function loadNews() {
            const newsList = document.getElementById('news-list');
            try {
                // Fetch local json generated by GitHub Actions
                const response = await fetch('news.json?cb=' + Date.now());
                if (!response.ok) throw new Error("No news file found yet.");
                
                allNews = await response.json();
                filterNews();
            } catch (e) {
                newsList.innerHTML = '<div style="padding: 20px; text-align: center;">വാർത്തകൾ തയ്യാറാകുന്നു... ദയവായി കുറച്ചു സമയം കഴിഞ്ഞ് വീണ്ടും തുറക്കുക. (News is generating, please check back in a few minutes)</div>';
            }
        }

        function filterNews() {
            const newsList = document.getElementById('news-list');
            const category = document.getElementById('categorySelect').value;
            
            let filtered = (category === 'all') ? allNews : allNews.filter(item => item.category === category);
            
            if (filtered.length === 0) {
                newsList.innerHTML = '<div style="padding: 20px; text-align: center;">ഈ വിഭാഗത്തിൽ വാർത്തകൾ ലഭ്യമല്ല.</div>';
                return;
            }

            newsList.innerHTML = '';
            
            filtered.forEach(item => {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                
                // No dates, clean full title
                summary.innerHTML = `<h2>${item.title}</h2>`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'news-content';
                contentDiv.innerHTML = item.fullTextHTML + `<a class="original-link" href="${item.link}" target="_blank">മനോരമ വെബ്സൈറ്റിൽ കാണുക (Original Link)</a>`;
                
                details.appendChild(summary);
                details.appendChild(contentDiv);
                newsList.appendChild(details);
            });
        }

        window.onload = loadNews;
    </script>
</body>
</html>
